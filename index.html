<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>readme-ascii, ASCII art banner generator</title>

        <link rel="icon" type="image/png" href="favicon.png">
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <meta name="description" content="Turn a line of text into a crisp PNG banner, perfect for GitHub READMEs. Live preview, font picker, light or dark themes.">

        <link rel="canonical" href="https://ajmeese7.github.io/readme-ascii/">
        <meta property="og:type" content="website">
        <meta property="og:site_name" content="readme-ascii">
        <meta property="og:title" content="readme-ascii">
        <meta property="og:description" content="Turn a line of text into a crisp PNG banner, perfect for GitHub READMEs.">
        <meta property="og:url" content="https://ajmeese7.github.io/readme-ascii/">
        <meta property="og:image" content="https://ajmeese7.github.io/readme-ascii/social-card.png">
        <meta property="og:image:type" content="image/png">
        <meta property="og:image:width" content="1200">
        <meta property="og:image:height" content="630">
        <meta property="og:image:alt" content="readme-ascii ASCII art logo">

        <meta name="twitter:card" content="summary_large_image">
        <meta name="twitter:title" content="readme-ascii">
        <meta name="twitter:description" content="Turn a line of text into a crisp PNG banner, perfect for GitHub READMEs.">
        <meta name="twitter:image" content="https://ajmeese7.github.io/readme-ascii/social-card.png">
        <meta name="twitter:image:alt" content="readme-ascii ASCII art logo">

        <link rel="stylesheet" href="index.css">

        <script>
            // Apply saved theme before paint to avoid flash-of-wrong-theme.
            (function() {
                try {
                    var saved = localStorage.getItem("theme");
                    if (saved === "dark" || saved === "light") {
                        document.documentElement.setAttribute("data-theme", saved);
                    } else if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) {
                        document.documentElement.setAttribute("data-theme", "dark");
                    }
                } catch (e) {}
            })();
        </script>

        <script src="https://cdn.jsdelivr.net/npm/figlet@1/lib/figlet.js"></script>
        <script>
            figlet.defaults({ fontPath: "https://cdn.jsdelivr.net/npm/figlet@1/fonts" });
        </script>

        <!-- Google Analytics 4. Replace G-XXXXXXXXXX with your measurement ID. See docs/GA4_SETUP.md. -->
        <script async src="https://www.googletagmanager.com/gtag/js?id=G-SFBVV16LGF"></script>
        <script>
            window.dataLayer = window.dataLayer || [];
            function gtag(){dataLayer.push(arguments);}
            gtag("js", new Date());
            gtag("config", "G-SFBVV16LGF");
        </script>

        <script src="index.js"></script>
    </head>

    <body>
        <header class="topbar">
            <a class="brand" href="https://github.com/ajmeese7/readme-ascii" aria-label="readme-ascii on GitHub">
                <img src="ASCII.png" class="brand-logo banner-light" alt="readme-ascii" />
                <img src="ASCII_light.png" class="brand-logo banner-dark" alt="readme-ascii" />
            </a>
            <button id="themeToggle" type="button" aria-label="Toggle light/dark theme">🌙</button>
            <script>
                // Set the toggle glyph synchronously so it matches the pre-paint theme.
                (function() {
                    var btn = document.getElementById("themeToggle");
                    if (btn) btn.textContent = document.documentElement.getAttribute("data-theme") === "dark" ? "\u{2600}\u{FE0F}" : "\u{1F319}";
                })();
            </script>
        </header>

        <main class="app" id="app">
            <aside class="sidebar" id="sidebar">
                <form id="userInput">
                    <label for="asciiText">Text</label>
                    <input id="asciiText" type="text" required placeholder="README ASCII" />

                    <label for="fontInput">Font</label>
                    <div class="combobox" id="fontCombobox">
                        <input
                            id="fontInput"
                            type="text"
                            autocomplete="off"
                            role="combobox"
                            aria-autocomplete="list"
                            aria-expanded="false"
                            aria-controls="fontList"
                            placeholder="Search fonts..."
                        />
                        <button id="fontInputClear" class="combobox-clear" type="button" aria-label="Clear font search" hidden>&#x2715;</button>
                        <div id="fontList" class="combobox-list" role="listbox" hidden></div>
                    </div>
                    <select id="font" hidden aria-hidden="true">
                        <option value="Alpha" selected>Alpha</option>
                        <option value="ANSI Shadow">ANSI Shadow</option>
                        <option value="Banner3">Banner3</option>
                        <option value="Big">Big</option>
                        <option value="Block">Block</option>
                        <option value="Bloody">Bloody</option>
                        <option value="Colossal">Colossal</option>
                        <option value="Doom">Doom</option>
                        <option value="DOS Rebel">DOS Rebel</option>
                        <option value="Ghost">Ghost</option>
                        <option value="Larry 3D">Larry 3D</option>
                        <option value="Roman">Roman</option>
                        <option value="Shadow">Shadow</option>
                        <option value="Slant">Slant</option>
                        <option value="Standard">Standard</option>
                        <option value="Star Wars">Star Wars</option>
                    </select>

                    <label for="txt-color">Text color</label>
                    <input id="txt-color" type="color" value="#000000" />

                    <label for="bg-color">Background color</label>
                    <input id="bg-color" type="color" value="#ffffff" disabled />

                    <div class="checkbox-row">
                        <input type="checkbox" id="transparent-bg" checked>
                        <label for="transparent-bg">Transparent background</label>
                    </div>
                    <div class="checkbox-row">
                        <input type="checkbox" id="shadow">
                        <label for="shadow">Enable shadow</label>
                    </div>

                    <fieldset id="shadowOptions" class="shadow-options" hidden>
                        <legend class="visually-hidden">Shadow options</legend>

                        <div class="shadow-options-header">
                            <span class="shadow-options-title">Shadow</span>
                            <button id="shadowReset" type="button" class="link-button">Reset</button>
                        </div>

                        <label for="shadow-color">Shadow color</label>
                        <input id="shadow-color" type="color" value="#000000" />

                        <label for="shadow-blur">
                            Blur <span class="range-value" id="shadow-blur-value">10</span>px
                        </label>
                        <input id="shadow-blur" type="range" min="0" max="40" step="1" value="10" />

                        <label for="shadow-offset-x">
                            Offset X <span class="range-value" id="shadow-offset-x-value">-5</span>px
                        </label>
                        <input id="shadow-offset-x" type="range" min="-30" max="30" step="1" value="-5" />

                        <label for="shadow-offset-y">
                            Offset Y <span class="range-value" id="shadow-offset-y-value">5</span>px
                        </label>
                        <input id="shadow-offset-y" type="range" min="-30" max="30" step="1" value="5" />
                    </fieldset>

                    <label for="scale">Export resolution</label>
                    <select id="scale">
                        <option value="1">1x (standard)</option>
                        <option value="2" selected>2x (sharp)</option>
                        <option value="4">4x (max)</option>
                    </select>

                    <div id="buttons">
                        <a href="#" id="download" download>
                            <button id="downloadButton" class="btn btn-success" type="button">Download</button>
                        </a>
                    </div>
                </form>
            </aside>

            <button id="sidebarToggle" class="sidebar-toggle" type="button" aria-label="Collapse sidebar" aria-expanded="true" aria-controls="sidebar">
                <span class="sidebar-toggle-glyph" aria-hidden="true">&#x2039;</span>
            </button>

            <section class="canvas" aria-label="Preview">
                <section id="featuredPreview" hidden aria-label="Selected font preview">
                    <header class="featured-header">
                        <button id="prevFontBtn" class="featured-nav" type="button" aria-label="Previous font">&#x2039;</button>
                        <span class="featured-label"></span>
                        <button id="nextFontBtn" class="featured-nav" type="button" aria-label="Next font">&#x203A;</button>
                        <a href="#" id="canvasDownload" class="featured-save" download aria-label="Save selected font as PNG">
                            <button id="canvasDownloadButton" class="btn btn-success btn-sm" type="button" disabled>Save</button>
                        </a>
                    </header>
                    <div class="featured-image">
                        <div class="spinner-container">
                            <div class="spinner" role="status" aria-label="Loading"></div>
                        </div>
                        <img id="result" alt="" style="visibility: hidden" />
                    </div>
                </section>
                <section id="fontGrid" hidden aria-label="Font comparison grid"></section>
            </section>
        </main>
    </body>
</html>
